      VAHAN_RUNNER_ID: playwright-2
      VAHAN_RUNNER_NAME: Chromium Playwright 2
      VAHAN_URL: https://analytics.parivahan.gov.in/analytics/vahanpublicreport?lang=en
    volumes:
      - ./apps/api-server/runtime/images1:/Users/mac/Desktop/vahan-automation/apps/api-server/runtime/images1
      - ./apps/api-server/app/ocr:/Users/mac/Desktop/vahan-automation/apps/api-server/app/ocr
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web-ui/Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  runner-3:
    <<: *extra-runner
    environment:
      <<: *extra-runner-environment
      VAHAN_RUNNER_ID: playwright-3
      VAHAN_RUNNER_NAME: Chromium Playwright 3
  runner-4:
