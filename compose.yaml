name: vahan-automation
services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: vahan
      POSTGRES_USER: vahan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-docker.py first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vahan -d vahan]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vahan:${POSTGRES_PASSWORD}@postgres:5432/vahan
      VAHAN_UI_AUTH_USERNAME: ${VAHAN_UI_AUTH_USERNAME:-admin}
      VAHAN_UI_AUTH_PASSWORD: ${VAHAN_UI_AUTH_PASSWORD:?Configure bootstrap password}
      VAHAN_UI_AUTH_TOKEN_SECRET: ${VAHAN_UI_AUTH_TOKEN_SECRET:?Configure signing secret}
      VAHAN_API_RUNNER_TOKEN: ${VAHAN_API_RUNNER_TOKEN:?Configure runner token}
      VAHAN_BROWSER_STATE_KEY: ${VAHAN_BROWSER_STATE_KEY:?Configure encryption key}
      VAHAN_API_CORS_ORIGINS: http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  runner:
    build:
      context: .
      dockerfile: apps/browser-runner/Dockerfile
    init: true
    shm_size: 1gb
    security_opt: ["seccomp=./docker/seccomp_profile.json"]
    environment:
      VAHAN_API_URL: http://api:8000
      VAHAN_API_RUNNER_TOKEN: ${VAHAN_API_RUNNER_TOKEN}
      VAHAN_RUNNER_ID: playwright-1
      VAHAN_URL: https://analytics.parivahan.gov.in/analytics/vahanpublicreport?lang=en
    volumes:
      - ./apps/api-server/runtime/images1:/Users/mac/Desktop/vahan-automation/apps/api-server/runtime/images1
      - ./apps/api-server/app/ocr:/Users/mac/Desktop/vahan-automation/apps/api-server/app/ocr
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web-ui/Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
