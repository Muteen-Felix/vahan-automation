name: Platform verification

on:
  push:
    branches: [main, ocr, release, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Source and browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Validate PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('run-vahan-rpa.ps1', 'backup-vahan-rpa.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Validate host secret setup
        run: python scripts/setup-docker.py

      - name: Validate local documentation links
        run: python scripts/check-doc-links.py

      - name: Install and test API
        working-directory: apps/api-server
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pytest verification/test_ocr_platform.py verification/test_captcha_ephemeral.py verification/test_captcha_refresh_race.py
          python -m pytest verification/test_production_config.py
          python -m unittest discover -s ../../scripts -p 'test_deployment_guard.py'
          python -m unittest discover -s ../../scripts -p 'test_worker_capacity.py'
          python -m unittest discover -s ../../scripts -p 'test_container_scan.py'
          python -m unittest discover -s ../../scripts -p 'test_postgres_pin.py'
          python -m unittest discover -s ../../scripts -p 'test_nginx_conf.py'
          python -m unittest discover -s ../../scripts -p 'test_image_labels.py'
          python -m unittest discover -s ../../scripts -p 'test_evidence_check.py'
          python -m unittest discover -s ../../scripts -p 'test_release_smoke.py'
          python -m unittest discover -s ../../scripts -p 'test_review_package.py'
          python -m unittest discover -s ../../scripts -p 'test_config_template.py'
          python -m unittest discover -s ../../scripts -p 'test_check_test_registration.py'
          python ../../tools/ui-drift-guard/test_ui_diagnostics.py
          python scripts/test-user-state-codec.py

      - name: Lint tests and scripts (ruff E9,F)
        working-directory: apps/api-server
        shell: bash
        run: python -m ruff check --config pyproject.toml ../../scripts ../../tools tests verification scripts

      - name: Install runner dependencies
        working-directory: apps/browser-runner
        run: npm ci

      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        working-directory: apps/browser-runner
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        working-directory: apps/browser-runner
        run: npx playwright install chromium

      - name: Test browser runner
        working-directory: apps/browser-runner
        run: |
          npm run check
          npm run test:ui-health
          npm run test:results
          npm run test:lifecycle
          npm run test:filters
          npm run test:options
          npm run test:navigation
          npm run test:image-pipe
          npm run test:profile-options
          npm run test:main-report-save
          npm run test:ocr-start

      - name: Install dashboard dependencies
        working-directory: apps/web-ui
        run: npm ci

      - name: Build and test dashboard
        working-directory: apps/web-ui
        run: |
          npm run check
          npm run build
          npm run test:platform

  database-integration:
    name: PostgreSQL verification (Ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: vahan
          POSTGRES_PASSWORD: platform-test-password
          POSTGRES_DB: vahan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vahan -d vahan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://vahan:platform-test-password@127.0.0.1:5432/vahan_api_test
      VAHAN_ALLOW_DATABASE_CLEAR: test-only
      VAHAN_API_RUNNER_TOKEN: platform-test-runner-token-0123456789
      VAHAN_UI_AUTH_TOKEN_SECRET: platform-test-signing-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      VAHAN_BROWSER_STATE_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install Socket.IO smoke-test dependencies
        working-directory: apps/web-ui
        run: npm ci
      - name: Install API dependencies
        run: python -m pip install --require-hashes -r apps/api-server/requirements-dev.lock
      - name: Create isolated verification databases
        working-directory: apps/api-server
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          names = [
              'vahan_api_test',
              'vahan_results_platform_report_test',
              'vahan_results_platform_annual_test',
              'vahan_results_platform_profiles_test',
              'vahan_results_platform_contract_test',
              'vahan_results_platform_controls_test',
              'vahan_results_platform_update_test',
              'vahan_results_platform_pool_test',
              'vahan_session_platform_test',
              'vahan_retry_platform_test',
              'vahan_coverage_platform_test',
              'vahan_schedule_platform_test',
              'vahan_queue_platform_test',
              'vahan_shared_batch_platform_test',
              'vahan_account_platform_test',
              'vahan_history_platform_test',
              'vahan_lifecycle_platform_test',
              'vahan_migration_platform_test',
              'vahan_migration_daily_test',
              'vahan_results_platform_state_test',
              'vahan_results_platform_gate_test',
              'vahan_migration_platform_state_test',
          ]

          async def main():
              connection = await asyncpg.connect(
                  'postgresql://vahan:platform-test-password@127.0.0.1:5432/vahan'
              )
              try:
                  for name in names:
                      await connection.execute(f'CREATE DATABASE "{name}"')
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Run schema migrations
        working-directory: apps/api-server
        run: python -m app.migrate

      - name: Run database-backed verification in isolated processes
        working-directory: apps/api-server
        shell: bash
        run: |
          python -m coverage run --source=app/api -m pytest tests
          python -m coverage run --append --source=app/api -m pytest verification/test_permissions.py
          python ../../scripts/test_runtime_role_lifecycle.py
          python ../../scripts/test_provision_database.py
          VAHAN_ACCOUNT_TEST_DATABASE=vahan_account_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_account_passwords.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_report_test python -m coverage run --append --source=app/api -m pytest verification/test_report_results.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_annual_test python -m coverage run --append --source=app/api -m pytest verification/test_annual_reports.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_profiles_test python -m coverage run --append --source=app/api -m pytest verification/test_filter_profiles.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_contract_test python -m coverage run --append --source=app/api -m pytest verification/test_ui_contract.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_controls_test python -m coverage run --append --source=app/api -m pytest verification/test_run_controls.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_update_test python -m coverage run --append --source=app/api -m pytest verification/test_update_status.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_pool_test python -m coverage run --append --source=app/api -m pytest verification/test_worker_pool.py
          VAHAN_SESSION_TEST_DATABASE=vahan_session_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_session_limits.py
          VAHAN_RETRY_TEST_DATABASE=vahan_retry_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_retry_sessions.py
          VAHAN_COVERAGE_TEST_DATABASE=vahan_coverage_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_report_coverage.py
          VAHAN_SCHEDULE_TEST_DATABASE=vahan_schedule_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_run_schedules.py
          VAHAN_QUEUE_TEST_DATABASE=vahan_queue_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_queue_retry_checkpoints.py
          VAHAN_HISTORY_TEST_DATABASE=vahan_history_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_run_history.py
          VAHAN_LIFECYCLE_TEST_DATABASE=vahan_lifecycle_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_worker_lifecycle.py
          VAHAN_QUEUE_MIGRATION_TEST_DATABASE=vahan_migration_platform_test python -m coverage run --append --source=app/api -m pytest verification/test_queue_migrations.py
          VAHAN_DAILY_MIGRATION_TEST_DATABASE=vahan_migration_daily_test python -m coverage run --append --source=app/api -m pytest verification/test_daily_schedule_removal.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_state_test python -m coverage run --append --source=app/api -m pytest verification/test_runner_state_fencing.py
          VAHAN_RESULT_TEST_DATABASE=vahan_results_platform_gate_test python -m coverage run --append --source=app/api -m pytest verification/test_gate_ops.py
          VAHAN_STATE_MIGRATION_TEST_DATABASE=vahan_migration_platform_state_test python -m coverage run --append --source=app/api -m pytest verification/test_state_gate_migration.py
          python -m coverage report --fail-under=90.1 --include='app/api/*'
          python -m coverage report --fail-under=90.1 --include='app/api/jobs.py'
          PYTHONPATH=. DATABASE_URL=postgresql+asyncpg://vahan:platform-test-password@127.0.0.1:5432/vahan_shared_batch_platform_test python verification/test_shared_batch_queue.py
          VAHAN_FIXTURE_POSTGRES_CONTAINER=${{ job.services.postgres.id }} python verification/prepare_report_test_fixtures.py
          VAHAN_MIGRATION_SOURCE_DATABASE=vahan_results_round2_legacy_source_test VAHAN_MIGRATION_TEST_DATABASE=vahan_results_round2_legacy_target_test python verification/test_main_migration.py
          VAHAN_SHARED_TEST_DATABASE=vahan_results_round2_shared_target_test python verification/test_shared_migration.py
          VAHAN_MIGRATION_SOURCE_DATABASE=vahan_results_round2_workbook_source_test VAHAN_MIGRATION_TEST_DATABASE=vahan_results_round2_workbook_target_test python verification/test_main_live_workbook.py

  test-registration:
    name: Test registration (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Every test file is registered and referenced by this workflow
        run: python scripts/check-test-registration.py ${{ (startsWith(github.ref_name, 'release') || startsWith(github.base_ref, 'release')) && '--require-history' || '' }}

  container-build:
    name: Linux container packaging (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Enable containerd image store for SBOM and provenance
        uses: docker/setup-docker-action@v5.5.0
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - name: Install pinned Docker Compose with attestation support
        uses: docker/setup-compose-action@v2.4.0
        with:
          version: v5.6.0
      - name: Create isolated build settings
        run: python scripts/setup-docker.py
      - name: Validate Compose package
        run: docker compose --env-file .docker.env config --quiet
      - name: Test production container security
        env:
          VAHAN_VCS_REF: ${{ github.sha }}
        run: python scripts/test_container_security.py
      - name: Test packaged Chromium sandbox and real Tesseract
        run: docker run --rm --init --shm-size=1g --security-opt seccomp=./docker/seccomp_profile.json --entrypoint node vahan-security-test/runner:round4 test-container-runtime.mjs
      - name: Scan images and write full reports and CycloneDX SBOMs
        run: python scripts/scan_container_images.py --output-dir "${{ runner.temp }}/container-sbom"
      - name: Upload vulnerability reports and container SBOMs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: round4-container-sbom
          path: ${{ runner.temp }}/container-sbom/*.json
          if-no-files-found: warn
          retention-days: 30
