name: Security verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22'}
      - name: Install locked API dependencies
        run: |
          python -m pip install --require-hashes -r apps/api-server/requirements-dev.lock
          python -m pip install --no-deps -e apps/api-server
      - name: Verify authentication and worker boundaries
        working-directory: apps/api-server
        run: python -m pytest verification/test_soc_unit.py verification/test_permissions.py -q
      - name: Verify MFA, cookie CSRF and atomic limits on an isolated database
        run: python scripts/run-security-verification.py
      - name: Audit Node dependencies and build UI
        run: |
          cd apps/browser-runner
          npm ci
          npm audit --audit-level=high
          npm run check
          cd ../web-ui
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Scan Git history for credentials
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --log-opts=--all --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
      - name: Validate deployment package
        run: |
          python scripts/setup-docker.py
          docker compose --env-file .docker.env config --quiet
          docker compose --env-file .docker.env build
      - name: Scan fixable critical and high image advisories
        run: |
          for service in api web runner postgres soc backup; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.74.0 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "vahan-automation/$service:soc"
          done
