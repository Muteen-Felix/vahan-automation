# qc-agent:generated — sinh Ground-Truth (test case từ PRD) và mở PR cho QA duyệt. Ghim @<commit SHA> (không @main) và image theo digest.
# Luồng, bẫy (GITHUB_TOKEN không kích hoạt workflow pull_request) và cách bật khoá QA: docs/groundtruth.md trong repo qc-agent.
# Secret cần ở repo này: MỘT trong hai khoá LLM để sinh test case (PRD được gửi tới nhà cung cấp LLM đã chọn): ANTHROPIC_API_KEY (mặc định) hoặc GEMINI_API_KEY
# (khi bỏ comment `model: gemini-...` ở khối with bên dưới). Tuỳ chọn: qc_bot_token (GitHub App/PAT để PR mở ra kích hoạt check).
name: qc-groundtruth
on:
  push:
    branches: ["main"]
    paths:
      - "docs/prd/**"
  workflow_dispatch:
    inputs:
      prd_path:
        description: "PRD cần sinh Ground-Truth (đường dẫn tương đối, hoặc glob)"
        required: true
        default: "docs/prd/**"
  pull_request:
    paths:
      - ".qc-agent/**"

jobs:
  groundtruth:
    permissions:               # quyền TỐI THIỂU: job validate trong workflow tái sử dụng tự hạ xuống chỉ-đọc
      contents: write          # đẩy nhánh qc-agent/gt/<prd-id>
      pull-requests: write     # mở PR
      packages: read           # kéo image từ GHCR
    uses: Muteen-Felix/QC-Agent/.github/workflows/qc-groundtruth.reusable.yml@d2cef36593a6eae891aacbf1e2ab2a61c174569b
    with:
      project: vahan-automation
      base_branch: "main"
      ghcr_username: "MinhDuc-IT"
      image: "ghcr.io/minhduc-it/qc-agent@sha256:8d87867a641fd38f6e2ea274599d9e5d512a56d4c39a5bccc2c9f30d8aa65c5c"
      prd_path: ${{ inputs.prd_path || 'docs/prd/**' }}
      # OpenAPI của SUT để agent biết đúng endpoint. File tĩnh trong repo (job này không dựng SUT); xuất lại khi API đổi.
      openapi: "docs/openapi.json"
      # Dùng Gemini thay Claude: bỏ comment các dòng dưới và đặt secret GEMINI_API_KEY. Chỉ khoá của nhà cung cấp được chọn đi vào container.
      # model: gemini-3.6-flash
      # llm_min_interval_s: "12"                              # giãn cách giữa hai request (≈ 5 RPM, free tier)
      # llm_max_retries: "5"                                  # thử lại (exponential backoff) khi 429/5xx
      # llm_fallback_models: "gemini-3.8-flash,gemini-2.5-flash"   # model dự phòng khi 404/hết quota
      # Sinh bằng AGENT (đọc cả mã nguồn + OpenAPI đầy đủ, nhiều lượt, CHỈ Claude; cần secret ANTHROPIC_API_KEY): bỏ comment các dòng dưới.
      # MÃ NGUỒN ĐƯỢC GỬI TỚI ANTHROPIC: chỉ bật khi đã được phép (docs/groundtruth.md §5c, §8). Một lần chạy mất nhiều phút: đặt timeout_minutes.
      # agent: true
      # timeout_minutes: 60
      # agent_model: claude-sonnet-5-5
      # agent_max_cost_usd: "3"                                # trần chi phí ước tính cho một PRD
    secrets:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      qc_bot_token: ${{ secrets.QC_BOT_TOKEN }}
