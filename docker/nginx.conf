limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 52m;
    client_body_timeout 30s;
    send_timeout 30s;
    limit_conn connections 20;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8000;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_read_timeout 150s;
    }
    location /socket.io/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
