uncovered_acs:
- ac_id: AC-2.3
  reason: Việc hỗ trợ đầy đủ các loại field cụ thể cần kiểm tra qua catalog nội bộ
    và dữ liệu thực tế từ VAHAN; đây là một liệt kê danh mục cấu hình không có hành
    vi HTTP riêng biệt có thể assert cụ thể và đóng được.
- ac_id: AC-2.5
  reason: Yêu cầu kiểm tra UI rà lại lựa chọn con khi đổi cha là hành vi giao diện
    phía client, không thể quan sát qua API endpoint độc lập.
- ac_id: AC-2.6
  reason: Hành vi fixed/iterate yêu cầu hiểu ngữ cảnh đầy đủ các option thực tế từ
    VAHAN qua runner sống, không thể tạo test case độc lập không phụ thuộc dữ liệu
    nguồn ngoài.
- ac_id: AC-2.8
  reason: Việc đảm bảo 'nhánh cần thu thập không bị bỏ âm thầm' là một thuộc tính
    nội bộ khó xác minh qua assertion JSON đóng mà không biết cấu trúc response cụ
    thể.
- ac_id: AC-2.9
  reason: Việc tạo khóa chuẩn hóa không phụ thuộc thứ tự lựa chọn là một chi tiết
    cài đặt nội bộ (hashing/normalization) không có cách quan sát trực tiếp qua HTTP
    mà không biết rõ cấu trúc response.
- ac_id: AC-2.11
  reason: Ví dụ nghiệm thu yêu cầu dữ liệu thực tế từ VAHAN qua runner (RTO theo từng
    State) mà không thể tự tạo qua HTTP call độc lập, phụ thuộc vào dữ liệu nguồn
    ngoài.
- ac_id: AC-3.3
  reason: Việc kiểm tra form không yêu cầu worker count và khóa workerCount legacy
    không ảnh hưởng pool là hành vi logic nội bộ không thể quan sát qua một response
    HTTP đơn lẻ mà không biết cấu trúc nội bộ.
- ac_id: AC-3.4
  reason: Yêu cầu scheduler xử lý lịch dù tab đã đóng đòi hỏi chờ thời gian thực đến
    khi lịch đến hạn và quan sát hành vi nền, không thể kiểm trong một bộ HTTP call
    tức thời.
- ac_id: AC-3.5
  reason: Yêu cầu lịch Once hoàn tất không tự lặp lại đòi hỏi chờ đến khi lịch thực
    sự chạy xong, là một tiến trình theo thời gian thực không thể giả lập qua HTTP
    ngay lập tức.
- ac_id: AC-3.6
  reason: Kiểm tra clamp ngày 29/30/31 khi chuyển tháng monthly đòi hỏi quan sát hành
    vi scheduler theo thời gian thực qua nhiều tháng, không thể kiểm tức thời qua
    HTTP.
- ac_id: AC-3.7
  reason: Luồng chuyển năm tạo profile/lịch năm tiếp theo là một quy trình nghiệp
    vụ phức tạp theo thời gian dài hạn, PRD cũng ghi rõ chưa có full live evidence,
    không phù hợp để assert cụ thể qua HTTP.
- ac_id: AC-3.8
  reason: Disable future runs và bật lại next start nhất quán đòi hỏi theo dõi trạng
    thái lịch qua thời gian dài, không thể kiểm tức thời bằng HTTP call đơn giản.
- ac_id: AC-4.2
  reason: Giới hạn mỗi runner xử lý tối đa một case cùng lúc đòi hỏi mô phỏng nhiều
    runner thực đồng thời với browser thật, vượt quá khả năng kiểm bằng HTTP black-box
    đơn giản.
- ac_id: AC-4.4
  reason: Việc điền filter theo phụ thuộc và đọc lại DOM để xác minh là hành vi thực
    thi browser automation nội bộ của runner, không quan sát được qua API endpoint.
- ac_id: AC-4.6
  reason: Việc không log chuỗi OCR thô là một thuộc tính về cách ghi log nội bộ, không
    thể kiểm tra qua response HTTP mà cần truy cập log hệ thống.
- ac_id: AC-4.7
  reason: Yêu cầu workbook export đầy đủ và upload thành công đòi hỏi tích hợp với
    trình duyệt thực thi VAHAN thật, không thể giả lập hoàn chỉnh qua HTTP call độc
    lập.
- ac_id: AC-4.8
  reason: Phân biệt NO_DATA hợp lệ với lỗi timeout/TLS/404 đòi hỏi mô phỏng lỗi mạng
    thực tế trong quá trình truy cập VAHAN, vượt quá phạm vi kiểm HTTP đen hộp đơn
    giản.
- ac_id: AC-4.9
  reason: Kiểm tra kết quả gửi lại/đến muộn qua kiểm identity/trạng thái đòi hỏi mô
    phỏng race condition thực tế giữa nhiều runner, khó tạo độc lập qua HTTP đơn giản
    không có dữ liệu case thực.
- ac_id: AC-4.10
  reason: Việc ghi nhận lỗi với stage/code/detail cụ thể là chi tiết logging nội bộ
    phụ thuộc vào runner thực thi browser, không thể kiểm trực tiếp qua HTTP mà không
    có dữ liệu lỗi thực tế xảy ra.
- ac_id: AC-5.3
  reason: Retry giữ case identity và liên kết attempt trước đòi hỏi có case/job thực
    tế đã chạy và thất bại trước đó trong hệ thống, không thể tự tạo độc lập qua HTTP
    mà không phụ thuộc vào runner thực.
- ac_id: AC-5.4
  reason: Kiểm tra NO_DATA không bị đưa vào vòng retry lỗi đòi hỏi có case đã hoàn
    tất với trạng thái NO_DATA thực tế trong hệ thống, phụ thuộc vào thực thi runner
    thật.
- ac_id: AC-5.5
  reason: Xử lý runner disconnect theo grace/lease đòi hỏi mô phỏng mất kết nối mạng
    thực sự của runner, vượt quá khả năng kiểm bằng HTTP request đơn thuần.
- ac_id: AC-5.6
  reason: Khôi phục sau restart API từ SQL đòi hỏi restart thực sự server và quan
    sát trạng thái nội bộ, không thể kiểm qua HTTP call khi đang chạy bình thường.
- ac_id: AC-5.7
  reason: Hành vi khi mất mạng VAHAN đòi hỏi mô phỏng lỗi mạng thực tế tới nguồn ngoài,
    không thể tạo qua HTTP call tới hệ thống dưới kiểm thử.
- ac_id: AC-5.8
  reason: Đây là đề xuất (ĐX) chưa triển khai theo PRD, không có hành vi hệ thống
    thực tế để kiểm.
- ac_id: AC-6.2
  reason: Việc hiển thị '—' cho dữ liệu thiếu và không biến NULL thành 0 là hành vi
    hiển thị UI phía client, không thể kiểm qua response JSON thô mà không biết rõ
    cấu trúc field cụ thể.
- ac_id: AC-6.3
  reason: Hành vi Clear xóa điều kiện tìm kiếm là tương tác UI phía client, không
    có endpoint HTTP riêng biệt để kiểm.
- ac_id: AC-6.5
  reason: Hiển thị thống kê Last updated/Months with data phụ thuộc cấu trúc response
    cụ thể và dữ liệu thực tế đã ingest, không có đặc tả rõ ràng format trả lời để
    assert.
- ac_id: AC-6.8
  reason: Hộp xác nhận với hủy, Escape, focus là hành vi giao diện người dùng thuần
    UI, không thể kiểm qua HTTP API.
- ac_id: AC-6.10
  reason: Kiểm tra nội dung chi tiết file Excel (tiêu đề, summary, định dạng số lớn)
    đòi hỏi parse file nhị phân, vượt quá khả năng assertion JSON đóng của bộ test
    HTTP này.
- ac_id: AC-6.11
  reason: Lưu lịch sử cập nhật và checksum để đối chiếu ingest lặp là cơ chế nội bộ,
    không có đặc tả cấu trúc response rõ ràng để assert qua HTTP mà không đoán giá
    trị.
- ac_id: AC-6.12
  reason: Ví dụ nghiệm thu yêu cầu 250 dòng dữ liệu thực tế đã tồn tại trong hệ thống
    từ trước, không thể tự tạo dữ liệu này qua HTTP call trong một test case độc lập.
- ac_id: AC-7.2
  reason: Hiển thị đúng định nghĩa các số liệu tổng case/processed/with data/no data/failed
    đòi hỏi có run thực tế đã hoàn thành với dữ liệu đã biết trước, không thể tạo
    độc lập qua HTTP.
- ac_id: AC-7.3
  reason: Kiểm tra không có chế độ mẫu dữ liệu trong Run History là việc xác minh
    nguồn gốc dữ liệu nội bộ (DB thật và không phải mock), không thể quan sát qua
    response HTTP đơn thuần.
- ac_id: AC-7.4
  reason: ETA dựa trên throughput/active elapsed đòi hỏi quan sát một lượt chạy thực
    tế qua thời gian, với các trường hợp pause/stall, không thể kiểm tức thời bằng
    HTTP.
- ac_id: AC-7.6
  reason: Phân biệt chờ runner/bận planning với lỗi website dựa trên bằng chứng tương
    ứng đòi hỏi mô phỏng tình huống lỗi thực tế phức tạp, khó assert đóng qua một
    response JSON cụ thể.
- ac_id: AC-8.1
  reason: Hướng dẫn cài đặt mới với secrets, migration và thứ tự khởi động là tài
    liệu vận hành, không phải hành vi API có thể kiểm qua HTTP.
- ac_id: AC-8.4
  reason: Restore vào project tách biệt và chuyển traffic là quy trình vận hành hạ
    tầng thủ công, không có endpoint HTTP để kiểm qua black-box testing.
- ac_id: AC-8.5
  reason: Gói bàn giao nhận diện image/revision và bằng chứng deploy là quy trình
    vận hành/CI-CD, không phải hành vi API có thể kiểm qua HTTP request/response.
